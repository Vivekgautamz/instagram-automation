services:
  - type: web
    name: instagram-automation
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python backend/server.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: IG_USER_ID
        sync: false
      - key: FB_ACCESS_TOKEN
        sync: false
      - key: FOREVERMOMENTS_IG_USER_ID
        sync: false
      - key: FOREVERMOMENTS_FB_ACCESS_TOKEN
        sync: false
